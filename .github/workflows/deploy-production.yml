name: Deploy Production
run-name: Deploy Production ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed commit on main
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      AUDIT_UNTIL: ${{ vars.AUTOMATION_BILLING_VERIFIED_UNTIL }}
      AUTOMATION_HALTED: ${{ vars.AUTOMATION_HALTED }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Validate release and wait for exact-SHA CI
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.AUTOMATION_HALTED === 'true') throw new Error('Production halt is active');
            const incidents = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'type:incident', per_page: 1 });
            if (incidents.data.length) throw new Error('Open production incident; owner investigation required');
            const expiry = Date.parse(process.env.AUDIT_UNTIL);
            if (!Number.isFinite(expiry) || expiry <= Date.now()) throw new Error('Billing audit is unverified or expired');
            const sha = process.env.TARGET_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid SHA');
            if (context.ref !== 'refs/heads/main') throw new Error('Dispatch must use main');
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('Release must match the current main commit');
            for (let attempt = 0; attempt < 50; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 10 });
              const run = data.workflow_runs[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Exact-SHA CI failed');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Exact-SHA CI timed out');
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture previous production
        id: previous
        run: node scripts/automation/deployment.mjs previous
      - name: Pull Vercel environment
        run: npx vercel@64.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Keep external calls disabled until separately audited
        run: |
          printf '\nALLOW_LIVE_LLM="false"\nALLOW_LIVE_EMAIL="false"\n' >> .vercel/.env.production.local
      - name: Build production artifact
        run: npx vercel@64.2.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production artifact
        id: deploy
        run: npx vercel@64.2.0 deploy --prebuilt --prod --env ALLOW_LIVE_LLM=false --env ALLOW_LIVE_EMAIL=false --token="$VERCEL_TOKEN" > .deployment-url
      - name: Verify production
        id: verify
        run: node scripts/automation/deployment.mjs verify
      - name: Rollback previous production
        id: rollback
        if: ${{ failure() && steps.previous.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        run: npx vercel@64.2.0 rollback '${{ steps.previous.outputs.previous }}' --yes --token="$VERCEL_TOKEN" --timeout 60s
      - name: Record release incident
        if: ${{ failure() && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        uses: actions/github-script@v7
        env:
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        with:
          script: |
            const rollback = process.env.ROLLBACK_OUTCOME;
            await github.rest.issues.create({ ...context.repo, title: '[Incident]: automated production verification failed', labels: ['type:incident'], body: `Commit: ${process.env.TARGET_SHA}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nRollback: ${rollback}\nIf rollback was unsuccessful, automated releases must remain halted.` });
            await core.summary.addRaw(`Rollback outcome: ${rollback}`).write();
