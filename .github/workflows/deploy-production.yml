name: Deploy Production
run-name: Deploy Production ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed commit on main
        required: true
        type: string
      rollback_drill:
        description: Verify a safe release, then deliberately exercise rollback and recovery
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      AUDIT_UNTIL: ${{ vars.AUTOMATION_BILLING_VERIFIED_UNTIL }}
      AUTOMATION_HALTED: ${{ vars.AUTOMATION_HALTED }}
      AUTOMATION_PRODUCTION_ALIAS: ${{ vars.AUTOMATION_PRODUCTION_ALIAS }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
      HEALTHCHECK_TOKEN: ${{ secrets.AUTOMATION_HEALTHCHECK_TOKEN }}
    steps:
      - name: Validate release and wait for exact-SHA CI
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.AUTOMATION_HALTED === 'true') throw new Error('Production halt is active');
            const incidents = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'type:incident', per_page: 1 });
            if (incidents.data.length) throw new Error('Open production incident; owner investigation required');
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            if (open.some(i => i.title.startsWith('[Release lease] '))) throw new Error('An earlier release still needs verification or recovery');
            const expiry = Date.parse(process.env.AUDIT_UNTIL);
            if (!Number.isFinite(expiry) || expiry <= Date.now()) throw new Error('Billing audit is unverified or expired');
            if (!process.env.HEALTHCHECK_TOKEN) throw new Error('Runtime health-check secret is missing');
            const sha = process.env.TARGET_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid SHA');
            if (context.ref !== 'refs/heads/main') throw new Error('Dispatch must use main');
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('Release must match the current main commit');
            for (let attempt = 0; attempt < 50; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 10 });
              const run = data.workflow_runs[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Exact-SHA CI failed');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Exact-SHA CI timed out');
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture previous production
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/automation/deployment.mjs previous
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@64.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Keep external calls disabled until separately audited
        run: |
          cat > .vercel/.env.production.local <<'EOF'
          DATABASE_URL="postgresql://build:build@127.0.0.1:5432/build"
          DIRECT_URL="postgresql://build:build@127.0.0.1:5432/build"
          AUTH_SECRET="build-only-not-a-runtime-secret"
          AUTH_URL="http://localhost:3000"
          ALLOW_LIVE_LLM="false"
          ALLOW_LIVE_EMAIL="false"
          EOF
      - name: Build production artifact
        run: npx vercel@64.2.0 build --prod
      - name: Record release recovery lease
        id: lease
        uses: actions/github-script@v7
        env:
          PREVIOUS: ${{ steps.previous.outputs.previous }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        with:
          script: |
            const { data } = await github.rest.issues.create({ ...context.repo, title: `[Release lease] ${context.runId}`, body: JSON.stringify({ runId: context.runId, sha: process.env.TARGET_SHA, previous: process.env.PREVIOUS, previousSha: process.env.PREVIOUS_SHA }) });
            core.setOutput('issue', data.number);
      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@64.2.0 deploy --prebuilt --prod --meta automationReleaseSha="$TARGET_SHA" --env ALLOW_LIVE_LLM=false --env ALLOW_LIVE_EMAIL=false --env GEMINI_API_KEY= --env ANTHROPIC_API_KEY= --env AUTH_RESEND_KEY= --env GOOGLE_GENERATIVE_AI_API_KEY= --env HEALTHCHECK_TOKEN="$HEALTHCHECK_TOKEN" --env AUTOMATION_RELEASE_SHA="$TARGET_SHA" --token="$VERCEL_TOKEN" > .deployment-url
      - name: Verify production
        id: verify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
        run: |
          node scripts/automation/deployment.mjs verify
          if [ "$ROLLBACK_DRILL" = "true" ]; then
            echo "Controlled rollback drill: production smoke passed; exercising failure recovery."
            exit 1
          fi
      - name: Close verified release lease
        uses: actions/github-script@v7
        env:
          LEASE: ${{ steps.lease.outputs.issue }}
        with:
          script: |
            await github.rest.issues.update({ ...context.repo, issue_number: Number(process.env.LEASE), state: 'closed' });
      - name: Rollback previous production
        id: rollback
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        if: ${{ always() && steps.previous.outcome == 'success' && steps.deploy.outcome != 'skipped' && (steps.deploy.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: node scripts/automation/deployment.mjs rollback
      - name: Verify rollback
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        run: node scripts/automation/deployment.mjs verify-rollback
      - name: Record release incident
        if: ${{ always() && steps.deploy.outcome != 'skipped' && steps.deploy.outcome != '' && (steps.deploy.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: actions/github-script@v7
        env:
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        with:
          script: |
            const rollback = process.env.ROLLBACK_OUTCOME;
            await github.rest.issues.create({ ...context.repo, title: '[Incident]: automated production verification failed', labels: ['type:incident'], body: `Commit: ${process.env.TARGET_SHA}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nRollback: ${rollback}\nIf rollback was unsuccessful, automated releases must remain halted.` });
            await core.summary.addRaw(`Rollback outcome: ${rollback}`).write();
