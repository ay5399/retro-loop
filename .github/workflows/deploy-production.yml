name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pull Vercel environment
        run: npx vercel@64.2.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build production artifact
        run: npx vercel@64.2.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production artifact
        run: npx vercel@64.2.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
